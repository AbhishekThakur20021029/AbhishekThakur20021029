<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="canvas-f">
      <rect width="1200" height="170" rx="28"/>
    </clipPath>
    <radialGradient id="f-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AECBEE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#AECBEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F1DE9C" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F1DE9C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-green" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B4DFC1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#B4DFC1" stop-opacity="0"/>
    </radialGradient>
    <filter id="pill-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3A3A33" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="pill-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="pill-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#canvas-f)">
    <rect width="1200" height="170" fill="#F6F5F1"/>

    <ellipse cx="120" cy="170" rx="340" ry="260" fill="url(#f-amber)"/>
    <ellipse cx="620" cy="-40" rx="420" ry="260" fill="url(#f-green)"/>
    <ellipse cx="1090" cy="180" rx="360" ry="260" fill="url(#f-blue)"/>

    <g filter="url(#pill-shadow)">
      <rect x="230" y="42" width="740" height="86" rx="43" fill="url(#pill-fill)"/>
    </g>
    <rect x="230.75" y="42.75" width="738.5" height="84.5" rx="42.25" stroke="url(#pill-edge)" stroke-width="1.5"/>

    <text x="600" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" fill="#4A4942">"Without data, you're just another person with an opinion."</text>
    <text x="600" y="107" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#8B897F">Thanks for visiting my profile</text>
  </g>
</svg>
