<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="canvas">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
    <radialGradient id="blob-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#AECBEE" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#AECBEE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#AECBEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-amber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F1DE9C" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#F1DE9C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F1DE9C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-green" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B4DFC1" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#B4DFC1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B4DFC1" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#3A3A33" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="glass-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glass-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="320" fill="#F6F5F1"/>

    <!-- soft colour glows tinted from the stack: SQL blue, Power BI amber, analytics green -->
    <ellipse cx="130" cy="30" rx="360" ry="330" fill="url(#blob-blue)"/>
    <ellipse cx="540" cy="360" rx="400" ry="340" fill="url(#blob-amber)"/>
    <ellipse cx="1030" cy="10" rx="380" ry="330" fill="url(#blob-green)"/>
    <ellipse cx="1180" cy="320" rx="300" ry="270" fill="url(#blob-blue)"/>

    <!-- frosted glass card -->
    <g filter="url(#card-shadow)">
      <rect x="160" y="64" width="880" height="192" rx="30" fill="url(#glass-fill)"/>
    </g>
    <rect x="160.75" y="64.75" width="878.5" height="190.5" rx="29.25" stroke="url(#glass-edge)" stroke-width="1.5"/>
    <path d="M190 65 H1010 A29 29 0 0 1 1039 94 V100 H161 V94 A29 29 0 0 1 190 65 Z" fill="url(#sheen)" opacity="0.5"/>

    <!-- text -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.5" fill="#26251F">Abhishek Thakur</text>
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.5" fill="#6E6C64">Data Analyst&#160;&#160;•&#160;&#160;Power BI&#160;&#160;•&#160;&#160;SQL&#160;&#160;•&#160;&#160;Python</text>
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8B897F">Turning raw data into meaningful business insights</text>
  </g>
</svg>
